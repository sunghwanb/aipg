<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Worksheet</title>

  <style>
    [hidden] {
      display: none !important;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .box {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
    }

    input[type="range"] {
      width: 100%;
      margin: 10px 0;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #status {
      padding: 10px;
      background: #eee;
      border-radius: 5px;
      white-space: pre-wrap;
    }

    #result {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 15px;
      min-height: 40px;
      margin-top: 10px;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #scoreValue {
      font-size: 28px;
      font-weight: bold;
    }

    #scoreLabel {
      color: #555;
    }

    .record {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }

    .record:last-child {
      border-bottom: none;
    }

    .record .meta {
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<h1>Worksheet</h1>

<!-- 회원 로그인 -->
<div class="box">
  <h2>회원 로그인</h2>

  <!-- 로그아웃 상태에서만 보임 -->
  <div id="authForm">
    <input type="email" id="email" placeholder="이메일" autocomplete="email">
    <input type="password" id="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">

    <button id="signupBtn">회원가입</button>
    <button id="loginBtn">로그인</button>
  </div>

  <!-- 로그인 상태에서만 보임 -->
  <div id="logoutArea" hidden>
    <button id="logoutBtn">로그아웃</button>
  </div>
</div>

<!-- 로그인 상태 -->
<div class="box">
  <h2>로그인 상태</h2>
  <div id="status">확인 중...</div>
</div>

<!-- 상호작용형 앱 -->
<div class="box">
  <h2>오늘의 컨디션 기록</h2>

  <div class="score-row">
    <span>컨디션 점수 (1~10)</span>
    <span><span id="scoreValue">5</span> <span id="scoreLabel">보통</span></span>
  </div>

  <input type="range" id="scoreSlider" min="1" max="10" value="5">

  <input type="text" id="memo" placeholder="한 줄 메모 (선택, 최대 50자)" maxlength="50">

  <button id="saveBtn" disabled>기록 저장</button>
  <button id="readBtn" disabled>기록 불러오기</button>

  <div id="result">로그인 후 사용할 수 있습니다.</div>
</div>


<script type="module">

/* ================================
   Firebase SDK
================================ */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  limit,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* ================================
   Firebase 설정
================================ */

const firebaseConfig = {
  apiKey: "AIzaSyBh8KVIP5zsKAxURYJM4qh8d9cKMRyYjh8",
  authDomain: "worksheet-f7a63.firebaseapp.com",
  projectId: "worksheet-f7a63",
  storageBucket: "worksheet-f7a63.firebasestorage.app",
  messagingSenderId: "356412174716",
  appId: "1:356412174716:web:faa71b37d2ce5f852674f9",
  measurementId: "G-D7893EEBD8"
};


/* ================================
   Firebase 초기화
================================ */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const COLLECTION_NAME = "test";


/* ================================
   HTML 요소
================================ */

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const authForm = document.getElementById("authForm");
const logoutArea = document.getElementById("logoutArea");

const signupBtn = document.getElementById("signupBtn");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

const saveBtn = document.getElementById("saveBtn");
const readBtn = document.getElementById("readBtn");

const statusBox = document.getElementById("status");
const result = document.getElementById("result");

const scoreSlider = document.getElementById("scoreSlider");
const scoreValue = document.getElementById("scoreValue");
const scoreLabel = document.getElementById("scoreLabel");
const memoInput = document.getElementById("memo");


/* ================================
   유틸 함수
================================ */

function scoreToLabel(score) {
  if (score <= 2) return "매우 나쁨";
  if (score <= 4) return "나쁨";
  if (score <= 6) return "보통";
  if (score <= 8) return "좋음";
  return "매우 좋음";
}

function errorMessage(prefix, error) {
  let detail = error.code + "\n" + error.message;

  if (error.code === "permission-denied") {
    detail = "권한이 없습니다. (permission-denied)\n허용된 계정으로 로그인했는지 확인하세요.";
  }

  return prefix + "\n" + detail;
}


/* ================================
   슬라이더 실시간 표시
================================ */

function updateScoreView() {
  const score = Number(scoreSlider.value);
  scoreValue.textContent = score;
  scoreLabel.textContent = scoreToLabel(score);
}

scoreSlider.addEventListener("input", updateScoreView);
updateScoreView();


/* ================================
   회원가입
================================ */

signupBtn.addEventListener("click", async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    alert("회원가입 성공\n" + userCredential.user.email);
  } catch (error) {
    console.error(error);
    alert(errorMessage("회원가입 실패", error));
  }

});


/* ================================
   로그인
================================ */

loginBtn.addEventListener("click", async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    alert("로그인 성공\n" + userCredential.user.email);
  } catch (error) {
    console.error(error);
    alert(errorMessage("로그인 실패", error));
  }

});


/* ================================
   로그아웃
================================ */

logoutBtn.addEventListener("click", async () => {

  try {
    await signOut(auth);
    alert("로그아웃 되었습니다.");
  } catch (error) {
    console.error(error);
    alert(errorMessage("로그아웃 실패", error));
  }

});


/* ================================
   로그인 상태 감지
   (로그인 여부에 따라 화면 전환)
================================ */

onAuthStateChanged(auth, (user) => {

  if (user) {
    statusBox.textContent =
      "로그인 상태\n\n" +
      "이메일 : " + user.email + "\n" +
      "UID : " + user.uid;

    authForm.hidden = true;      // 입력창, 회원가입, 로그인 숨김
    logoutArea.hidden = false;   // 로그아웃 표시

    emailInput.value = "";
    passwordInput.value = "";

    saveBtn.disabled = false;
    readBtn.disabled = false;
    result.textContent = "컨디션을 기록하거나 불러오세요.";
  }
  else {
    statusBox.textContent = "로그인되어 있지 않습니다.";

    authForm.hidden = false;     // 입력창, 회원가입, 로그인 표시
    logoutArea.hidden = true;    // 로그아웃 숨김

    saveBtn.disabled = true;
    readBtn.disabled = true;
    result.textContent = "로그인 후 사용할 수 있습니다.";
  }

});


/* ================================
   Firestore 데이터 저장
================================ */

saveBtn.addEventListener("click", async () => {

  const user = auth.currentUser;

  if (!user) {
    alert("먼저 로그인하세요.");
    return;
  }

  const score = Number(scoreSlider.value);
  const memo = memoInput.value.trim();

  saveBtn.disabled = true;

  try {
    const docRef = await addDoc(collection(db, COLLECTION_NAME), {
      score: score,
      label: scoreToLabel(score),
      memo: memo,
      email: user.email,
      uid: user.uid,
      createdAt: serverTimestamp()
    });

    result.textContent = "저장 성공\n\n문서 ID : " + docRef.id;
    memoInput.value = "";

  } catch (error) {
    console.error(error);
    result.textContent = errorMessage("저장 실패", error);
  } finally {
    saveBtn.disabled = false;
  }

});


/* ================================
   Firestore 데이터 읽기
================================ */

readBtn.addEventListener("click", async () => {

  const user = auth.currentUser;

  if (!user) {
    alert("먼저 로그인하세요.");
    return;
  }

  readBtn.disabled = true;

  try {
    const q = query(
      collection(db, COLLECTION_NAME),
      orderBy("createdAt", "desc"),
      limit(10)
    );

    const querySnapshot = await getDocs(q);

    result.textContent = "";

    if (querySnapshot.empty) {
      result.textContent = "저장된 데이터가 없습니다.";
      return;
    }

    querySnapshot.forEach((docSnap) => {
      const data = docSnap.data();

      const item = document.createElement("div");
      item.className = "record";

      const main = document.createElement("div");
      main.textContent =
        data.score + "점 (" + (data.label || "") + ")" +
        (data.memo ? " - " + data.memo : "");

      const meta = document.createElement("div");
      meta.className = "meta";

      const time = data.createdAt
        ? data.createdAt.toDate().toLocaleString("ko-KR")
        : "저장 중...";

      meta.textContent = (data.email || "") + " | " + time;

      item.appendChild(main);
      item.appendChild(meta);
      result.appendChild(item);
    });

  } catch (error) {
    console.error(error);
    result.textContent = errorMessage("읽기 실패", error);
  } finally {
    readBtn.disabled = false;
  }

});

</script>

</body>
</html>
