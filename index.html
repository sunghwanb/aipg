<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Worksheet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .box {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    #status {
      padding: 10px;
      background: #eee;
      border-radius: 5px;
    }

    #result {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 15px;
      min-height: 60px;
    }
  </style>
</head>

<body>

<h1>Worksheet</h1>

<div class="box">

  <h2>회원 로그인</h2>

  <input
    type="email"
    id="email"
    placeholder="이메일"
  >

  <input
    type="password"
    id="password"
    placeholder="비밀번호"
  >

  <button id="signupBtn">
    회원가입
  </button>

  <button id="loginBtn">
    로그인
  </button>

  <button id="logoutBtn">
    로그아웃
  </button>

</div>


<div class="box">

  <h2>로그인 상태</h2>

  <div id="status">
    확인 중...
  </div>

</div>


<div class="box">

  <h2>Firestore 테스트</h2>

  <button id="saveBtn">
    테스트 데이터 저장
  </button>

  <button id="readBtn">
    저장된 데이터 읽기
  </button>

  <div id="result"></div>

</div>


<script type="module">

/* ================================
   Firebase SDK
================================ */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* ================================
   Firebase 설정
================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyBh8KVIP5zsKAxURYJM4qh8d9cKMRyYjh8",

  authDomain:
    "worksheet-f7a63.firebaseapp.com",

  projectId:
    "worksheet-f7a63",

  storageBucket:
    "worksheet-f7a63.firebasestorage.app",

  messagingSenderId:
    "356412174716",

  appId:
    "1:356412174716:web:faa71b37d2ce5f852674f9",

  measurementId:
    "G-D7893EEBD8"

};


/* ================================
   Firebase 초기화
================================ */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ================================
   HTML 요소
================================ */

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const signupBtn =
  document.getElementById("signupBtn");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const saveBtn =
  document.getElementById("saveBtn");

const readBtn =
  document.getElementById("readBtn");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");


/* ================================
   회원가입
================================ */

signupBtn.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    try {

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      alert(
        "회원가입 성공\n" +
        userCredential.user.email
      );

    } catch (error) {

      console.error(error);

      alert(
        "회원가입 실패\n" +
        error.message
      );

    }

  }
);


/* ================================
   로그인
================================ */

loginBtn.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    try {

      const userCredential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      alert(
        "로그인 성공\n" +
        userCredential.user.email
      );

    } catch (error) {

      console.error(error);

      alert(
        "로그인 실패\n" +
        error.message
      );

    }

  }
);


/* ================================
   로그아웃
================================ */

logoutBtn.addEventListener(
  "click",
  async () => {

    try {

      await signOut(auth);

      alert(
        "로그아웃 되었습니다."
      );

    } catch (error) {

      console.error(error);

    }

  }
);


/* ================================
   로그인 상태 감지
================================ */

onAuthStateChanged(
  auth,
  (user) => {

    if (user) {

      status.innerHTML = `
        로그인 상태<br><br>

        이메일 :
        ${user.email}

        <br>

        UID :
        ${user.uid}
      `;

    }

    else {

      status.innerHTML =
        "로그인되어 있지 않습니다.";

    }

  }
);


/* ================================
   Firestore 데이터 저장
================================ */

saveBtn.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;

    if (!user) {

      alert(
        "먼저 로그인하세요."
      );

      return;

    }

    try {

      const docRef =
        await addDoc(
          collection(
            db,
            "test"
          ),
          {

            message:
              "Firebase 연결 성공",

            email:
              user.email,

            uid:
              user.uid,

            createdAt:
              serverTimestamp()

          }
        );

      result.innerText =
        "저장 성공\n\n문서 ID : "
        + docRef.id;

    } catch (error) {

      console.error(error);

      result.innerText =
        "저장 실패\n\n"
        + error.message;

    }

  }
);


/* ================================
   Firestore 데이터 읽기
================================ */

readBtn.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;

    if (!user) {

      alert(
        "먼저 로그인하세요."
      );

      return;

    }

    try {

      const querySnapshot =
        await getDocs(
          collection(
            db,
            "test"
          )
        );

      let text = "";

      querySnapshot.forEach(
        (doc) => {

          text +=
            "ID : "
            + doc.id
            + "\n";

          text +=
            JSON.stringify(
              doc.data(),
              null,
              2
            );

          text +=
            "\n\n";

        }
      );

      if (text === "") {

        text =
          "저장된 데이터가 없습니다.";

      }

      result.innerText =
        text;

    } catch (error) {

      console.error(error);

      result.innerText =
        "읽기 실패\n\n"
        + error.message;

    }

  }
);

</script>

</body>
</html>
